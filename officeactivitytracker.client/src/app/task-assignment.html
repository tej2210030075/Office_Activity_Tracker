<div class="assignment-page">

  <header class="assignment-header">
    <div>
      <h1>Assign New Task</h1>
      <p>Assign work to employees in your division.</p>
    </div>

    <button type="button"
            class="back-button"
            (click)="goBack()">
      Back to Dashboard
    </button>
  </header>

  <main class="assignment-content">

    <section class="assignment-card">

      <div class="card-heading">
        <h2>Task Details</h2>
        <p>
          Division:
          <strong>
            {{ user?.divisionName || ('Division ' + divisionId) }}
          </strong>
        </p>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="success-message" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <div class="loading-message" *ngIf="isLoading">
        Loading employees...
      </div>

      <form #taskForm="ngForm"
            (ngSubmit)="assignTask()">

        <div class="form-group">
          <label for="title">Task Title *</label>

          <input id="title"
                 type="text"
                 name="title"
                 [(ngModel)]="title"
                 placeholder="Enter task title"
                 maxlength="200"
                 required>
        </div>

        <div class="form-group">
          <label for="description">Task Description</label>

          <textarea id="description"
                    name="description"
                    [(ngModel)]="description"
                    placeholder="Describe the task and expected outcome"
                    rows="4">
          </textarea>
        </div>

        <div class="form-group">
          <label for="assignedToId">Assign Employee *</label>

          <select id="assignedToId"
                  name="assignedToId"
                  [(ngModel)]="assignedToId"
                  required>

            <option [ngValue]="null" disabled>
              Select an employee
            </option>

            <option *ngFor="let employee of employees"
                    [ngValue]="employee.id">

              {{ employee.fullName }}

            </option>

          </select>

          <small>
            Only active employees from your division are listed.
          </small>
        </div>

        <div class="form-row">

          <div class="form-group">
            <label for="startDate">Start Date *</label>

            <input id="startDate"
                   type="date"
                   name="startDate"
                   [(ngModel)]="startDate"
                   required>
          </div>

          <div class="form-group">
            <label for="deadline">Deadline *</label>

            <input id="deadline"
                   type="date"
                   name="deadline"
                   [(ngModel)]="deadline"
                   [min]="startDate"
                   required>
          </div>

        </div>

        <div class="form-group">
          <label for="priority">Priority *</label>

          <select id="priority"
                  name="priority"
                  [(ngModel)]="priority"
                  required>

            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>

          </select>
        </div>

        <div class="form-actions">

          <button type="button"
                  class="cancel-button"
                  (click)="goBack()">
            Cancel
          </button>

          <button type="submit"
                  class="submit-button"
                  [disabled]="taskForm.invalid || isSaving || isLoading">

            {{ isSaving ? 'Assigning Task...' : 'Assign Task' }}

          </button>

        </div>

      </form>

    </section>

  </main>

</div>
